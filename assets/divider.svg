<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 30" width="100%" height="30">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0" />
      <stop offset="30%" stop-color="#2563EB" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="1" />
      <stop offset="70%" stop-color="#7C3AED" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </linearGradient>

    <filter id="divGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(0, 15)">
    <line x1="50" y1="0" x2="950" y2="0" stroke="url(#divGrad)" stroke-width="2" filter="url(#divGlow)" />
    <!-- Center Diamond Accent -->
    <g transform="translate(500, 0)">
      <rect x="-8" y="-8" width="16" height="16" fill="#0F172A" stroke="#06B6D4" stroke-width="2" transform="rotate(45)" />
      <circle cx="0" cy="0" r="3" fill="#7C3AED" filter="url(#divGlow)" />
    </g>
  </g>
</svg>
