<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="100%" height="100%">
  <defs>
    <radialGradient id="footerBg" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#050816" />
      <stop offset="100%" stop-color="#02040A" />
    </radialGradient>

    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Inter:wght@400;500&amp;family=JetBrains+Mono&amp;display=swap');
      .footer-title {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 19px;
        fill: #F8FAFC;
        letter-spacing: 0.5px;
      }
      .footer-sub {
        font-family: 'Inter', sans-serif;
        font-size: 12.5px;
        fill: #94A3B8;
      }
      .footer-code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        fill: #06B6D4;
      }
    </style>
  </defs>

  <rect width="1200" height="130" rx="12" fill="url(#footerBg)" />
  <rect x="1" y="1" width="1198" height="128" rx="11" fill="none" stroke="url(#footerBorder)" stroke-width="1.5" />

  <!-- Animated Top Glowing Line -->
  <line x1="150" y1="0" x2="1050" y2="0" stroke="url(#footerBorder)" stroke-width="2.5" filter="url(#glow)" />

  <g transform="translate(600, 48)" text-anchor="middle">
    <!-- Glowing AI Core Emblem -->
    <circle cx="0" cy="-14" r="12" fill="#0F172A" stroke="#7C3AED" stroke-width="1.5" filter="url(#glow)" />
    <polygon points="0,-19 5,-11 0,-3 -5,-11" fill="#06B6D4" />

    <text x="0" y="20" class="footer-title">Engineered with Precision &amp; Vision</text>
    <text x="0" y="40" class="footer-sub">Building Next-Gen Autonomous AI &amp; Intelligent Desktop Automation</text>
    <text x="0" y="60" class="footer-code">© 2026 Bindudhara D  •  bindudharad  •  All Rights Reserved</text>
  </g>
</svg>
