<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBase" cx="50%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#050816" />
      <stop offset="100%" stop-color="#02040A" />
    </radialGradient>

    <pattern id="bgGridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.3" />
      <circle cx="60" cy="60" r="1.5" fill="#2563EB" fill-opacity="0.3" />
    </pattern>

    <radialGradient id="cyanOrb" cx="25%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#050816" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleOrb" cx="75%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#050816" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#bgBase)" />
  <rect width="1440" height="900" fill="url(#bgGridPattern)" />
  <rect width="1440" height="900" fill="url(#cyanOrb)" />
  <rect width="1440" height="900" fill="url(#purpleOrb)" />

  <!-- Constellation Nodes & Connections -->
  <g stroke="#38BDF8" stroke-opacity="0.15" stroke-width="1">
    <line x1="200" y1="150" x2="450" y2="280" />
    <line x1="450" y1="280" x2="350" y2="550" />
    <line x1="350" y1="550" x2="700" y2="400" />
    <line x1="700" y1="400" x2="1050" y2="220" />
    <line x1="1050" y1="220" x2="1250" y2="480" />
    <line x1="700" y1="400" x2="900" y2="680" />
    <line x1="450" y1="280" x2="700" y2="400" />
  </g>

  <g fill="#06B6D4" fill-opacity="0.6">
    <circle cx="200" cy="150" r="3" />
    <circle cx="450" cy="280" r="4" fill="#2563EB" />
    <circle cx="350" cy="550" r="3" />
    <circle cx="700" cy="400" r="5" fill="#7C3AED" />
    <circle cx="1050" cy="220" r="4" fill="#38BDF8" />
    <circle cx="1250" cy="480" r="3" />
    <circle cx="900" cy="680" r="4" fill="#A78BFA" />
  </g>
</svg>
