<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#050816" />
      <stop offset="100%" stop-color="#02040A" />
    </radialGradient>

    <!-- Glow Gradients -->
    <radialGradient id="blueGlow" cx="20%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#050816" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="purpleGlow" cx="80%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#050816" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#050816" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#7C3AED" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#06B6D4" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&amp;family=Inter:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap');

      .title {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 46px;
        fill: url(#textGrad);
        letter-spacing: -1px;
      }
      .subtitle {
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 18px;
        fill: #94A3B8;
        letter-spacing: 1.5px;
      }
      .badge-text {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 600;
        font-size: 12px;
        fill: #38BDF8;
      }
      .tag {
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 12.5px;
        fill: #E2E8F0;
      }
      .pulse-circle {
        animation: pulse 3s infinite alternate ease-in-out;
      }
      .float-node {
        animation: float 4s infinite alternate ease-in-out;
      }
      .dash-line {
        stroke-dasharray: 6 6;
        animation: dash 20s linear infinite;
      }
      @keyframes pulse {
        0% { r: 4px; opacity: 0.4; }
        100% { r: 8px; opacity: 0.9; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
    </style>
  </defs>

  <!-- Base Card -->
  <rect width="1200" height="360" rx="14" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="14" fill="url(#cyberGrid)" />

  <!-- Ambient Glow Orbs -->
  <rect width="1200" height="360" rx="14" fill="url(#blueGlow)" />
  <rect width="1200" height="360" rx="14" fill="url(#purpleGlow)" />
  <rect width="1200" height="360" rx="14" fill="url(#cyanGlow)" />

  <!-- Outer Glass Border -->
  <rect x="2" y="2" width="1196" height="356" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Neural Network Constellation (Right Side Visual) -->
  <g transform="translate(760, 20)">
    <path d="M 80 70 L 210 40 L 310 120 L 190 210 L 80 70 Z" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M 210 40 L 150 140 L 310 120 L 250 250 L 190 210" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M 80 70 L 150 140 L 90 230 L 190 210" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M 210 40 L 330 40 L 310 120 L 360 190 M 250 250 L 360 190" fill="none" stroke="#38BDF8" stroke-width="1" class="dash-line" stroke-opacity="0.5" />

    <circle cx="210" cy="40" r="30" fill="none" stroke="#2563EB" stroke-width="0.8" stroke-opacity="0.3" class="pulse-circle" />
    <circle cx="150" cy="140" r="38" fill="none" stroke="#7C3AED" stroke-width="0.8" stroke-opacity="0.3" class="pulse-circle" style="animation-delay: 1s;" />
    <circle cx="310" cy="120" r="26" fill="none" stroke="#06B6D4" stroke-width="0.8" stroke-opacity="0.3" class="pulse-circle" style="animation-delay: 1.5s;" />

    <g class="float-node">
      <circle cx="80" cy="70" r="6" fill="#38BDF8" filter="url(#neonGlow)" />
      <circle cx="210" cy="40" r="7" fill="#60A5FA" filter="url(#neonGlow)" />
      <circle cx="310" cy="120" r="6" fill="#C084FC" filter="url(#neonGlow)" />
      <circle cx="150" cy="140" r="8" fill="#22D3EE" filter="url(#neonGlow)" />
      <circle cx="190" cy="210" r="5" fill="#818CF8" filter="url(#neonGlow)" />
      <circle cx="90" cy="230" r="5" fill="#38BDF8" />
      <circle cx="250" cy="250" r="6" fill="#A78BFA" filter="url(#neonGlow)" />
      <circle cx="330" cy="40" r="4" fill="#06B6D4" />
      <circle cx="360" cy="190" r="5" fill="#60A5FA" />
    </g>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(70, 0)">
    <!-- Top Status Pill -->
    <g transform="translate(0, 50)">
      <rect width="250" height="30" rx="15" fill="#0F172A" fill-opacity="0.7" stroke="#2563EB" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="18" cy="15" r="4" fill="#10B981" filter="url(#softGlow)" />
      <text x="30" y="19" class="badge-text">BUILDING AUTONOMOUS AI</text>
    </g>

    <!-- Main Title & Name -->
    <text x="0" y="132" class="title" filter="url(#softGlow)">Bindudhara D</text>

    <!-- Subtitle / Roles -->
    <text x="0" y="168" class="subtitle">AI ENGINEER &amp; FULL STACK DEVELOPER</text>

    <!-- Special Interest Tags (Pill Badges) -->
    <g transform="translate(0, 198)">
      <g transform="translate(0, 0)">
        <rect width="115" height="28" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="12" y="18" class="tag">⚡ Agentic AI</text>
      </g>
      
      <g transform="translate(125, 0)">
        <rect width="140" height="28" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1" />
        <text x="12" y="18" class="tag" fill="#C084FC">🤖 ATLAS AI Creator</text>
      </g>

      <g transform="translate(275, 0)">
        <rect width="145" height="28" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#06B6D4" stroke-opacity="0.5" stroke-width="1" />
        <text x="12" y="18" class="tag">👁️ Computer Vision</text>
      </g>

      <g transform="translate(430, 0)">
        <rect width="145" height="28" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="12" y="18" class="tag">🔍 Semantic Search</text>
      </g>
    </g>

    <!-- Description Paragraph -->
    <g transform="translate(0, 262)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="13.5" fill="#94A3B8">
        Undergraduate in Artificial Intelligence &amp; Data Science • Designing &amp; Architecting Next-Gen Intelligent Systems
      </text>
      <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B">
        Location: Bangalore, India  |  GitHub: @bindudharad  |  Focus: AI Agents, System Design &amp; Full Stack
      </text>
    </g>
  </g>

  <!-- Bottom Visual Accent Line -->
  <path d="M 70 320 L 1130 320" stroke="url(#borderGrad)" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4" />
</svg>
