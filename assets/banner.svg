<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#050816" />
      <stop offset="100%" stop-color="#02040A" />
    </radialGradient>

    <!-- Glow Gradients -->
    <radialGradient id="blueGlow" cx="20%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#050816" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="purpleGlow" cx="80%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#050816" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#050816" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Metallic Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#7C3AED" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#06B6D4" fill-opacity="0.3" />
    </pattern>

    <!-- Drop Shadows & Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&amp;family=Inter:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap');

      .title {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 52px;
        fill: url(#textGrad);
        letter-spacing: -1px;
      }
      .subtitle {
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94A3B8;
        letter-spacing: 2px;
      }
      .badge-text {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 600;
        font-size: 13px;
        fill: #38BDF8;
      }
      .tag {
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 13px;
        fill: #E2E8F0;
      }
      .pulse-circle {
        animation: pulse 3s infinite alternate ease-in-out;
      }
      .float-node {
        animation: float 4s infinite alternate ease-in-out;
      }
      .dash-line {
        stroke-dasharray: 6 6;
        animation: dash 20s linear infinite;
      }
      @keyframes pulse {
        0% { r: 4px; opacity: 0.4; }
        100% { r: 8px; opacity: 0.9; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
    </style>
  </defs>

  <!-- Base Card -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#cyberGrid)" />

  <!-- Ambient Glow Orbs -->
  <rect width="1200" height="420" rx="16" fill="url(#blueGlow)" />
  <rect width="1200" height="420" rx="16" fill="url(#purpleGlow)" />
  <rect width="1200" height="420" rx="16" fill="url(#cyanGlow)" />

  <!-- Outer Glass Border -->
  <rect x="2" y="2" width="1196" height="416" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Neural Network Constellation (Right Side Visual) -->
  <g transform="translate(750, 40)">
    <!-- Connection Lines -->
    <path d="M 80 80 L 220 50 L 320 140 L 200 240 L 80 80 Z" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M 220 50 L 160 160 L 320 140 L 260 280 L 200 240" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M 80 80 L 160 160 L 90 260 L 200 240" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M 220 50 L 340 50 L 320 140 L 370 220 M 260 280 L 370 220" fill="none" stroke="#38BDF8" stroke-width="1" class="dash-line" stroke-opacity="0.5" />

    <!-- Pulse Waves -->
    <circle cx="220" cy="50" r="35" fill="none" stroke="#2563EB" stroke-width="0.8" stroke-opacity="0.3" class="pulse-circle" />
    <circle cx="160" cy="160" r="45" fill="none" stroke="#7C3AED" stroke-width="0.8" stroke-opacity="0.3" class="pulse-circle" style="animation-delay: 1s;" />
    <circle cx="320" cy="140" r="30" fill="none" stroke="#06B6D4" stroke-width="0.8" stroke-opacity="0.3" class="pulse-circle" style="animation-delay: 1.5s;" />

    <!-- Nodes -->
    <g class="float-node">
      <circle cx="80" cy="80" r="6" fill="#38BDF8" filter="url(#neonGlow)" />
      <circle cx="220" cy="50" r="8" fill="#60A5FA" filter="url(#neonGlow)" />
      <circle cx="320" cy="140" r="7" fill="#C084FC" filter="url(#neonGlow)" />
      <circle cx="160" cy="160" r="9" fill="#22D3EE" filter="url(#neonGlow)" />
      <circle cx="200" cy="240" r="6" fill="#818CF8" filter="url(#neonGlow)" />
      <circle cx="90" cy="260" r="5" fill="#38BDF8" />
      <circle cx="260" cy="280" r="7" fill="#A78BFA" filter="url(#neonGlow)" />
      <circle cx="340" cy="50" r="4" fill="#06B6D4" />
      <circle cx="370" cy="220" r="5" fill="#60A5FA" />
    </g>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 0)">
    <!-- Top Status Pill -->
    <g transform="translate(0, 65)">
      <rect width="270" height="34" rx="17" fill="#0F172A" fill-opacity="0.7" stroke="#2563EB" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="20" cy="17" r="4" fill="#10B981" filter="url(#softGlow)" />
      <text x="34" y="22" class="badge-text">BUILDING AUTONOMOUS AI</text>
    </g>

    <!-- Main Title & Name -->
    <text x="0" y="160" class="title" filter="url(#softGlow)">Bindudhara D</text>

    <!-- Subtitle / Roles -->
    <text x="0" y="200" class="subtitle">AI ENGINEER &amp; FULL STACK DEVELOPER</text>

    <!-- Special Interest Tags (Pill Badges) -->
    <g transform="translate(0, 235)">
      <!-- Tag 1: Agentic AI -->
      <g transform="translate(0, 0)">
        <rect width="125" height="32" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" class="tag">⚡ Agentic AI</text>
      </g>
      
      <!-- Tag 2: ATLAS AI -->
      <g transform="translate(137, 0)">
        <rect width="150" height="32" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1" />
        <text x="14" y="21" class="tag" fill="#C084FC">🤖 ATLAS AI Creator</text>
      </g>

      <!-- Tag 3: Computer Vision -->
      <g transform="translate(299, 0)">
        <rect width="155" height="32" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#06B6D4" stroke-opacity="0.5" stroke-width="1" />
        <text x="14" y="21" class="tag">👁️ Computer Vision</text>
      </g>

      <!-- Tag 4: Semantic Search -->
      <g transform="translate(466, 0)">
        <rect width="155" height="32" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" class="tag">🔍 Semantic Search</text>
      </g>
    </g>

    <!-- Description Paragraph -->
    <g transform="translate(0, 305)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="14" fill="#94A3B8">
        Undergraduate in Artificial Intelligence &amp; Data Science • Designing &amp; Architecting Next-Gen Intelligent Systems
      </text>
      <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748B">
        Location: Bangalore, India  |  GitHub: @bindudharad  |  Focus: AI Agents, System Design &amp; Full Stack
      </text>
    </g>
  </g>

  <!-- Bottom Visual Accent Line -->
  <path d="M 80 375 L 1120 375" stroke="url(#borderGrad)" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4" />
</svg>
