<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <radialGradient id="trustBg" cx="30%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050816" />
    </radialGradient>
    <linearGradient id="trustBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="trustGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono&amp;display=swap');
      .p-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; fill: #FFFFFF; }
      .p-subtitle { font-family: 'Inter', sans-serif; font-size: 13px; fill: #34D399; letter-spacing: 1px; }
      .p-desc { font-family: 'Inter', sans-serif; font-size: 13px; fill: #94A3B8; }
      .p-badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #E2E8F0; }
    </style>
  </defs>

  <rect width="600" height="320" rx="14" fill="url(#trustBg)" />
  <rect x="1.5" y="1.5" width="597" height="317" rx="12.5" fill="none" stroke="url(#trustBorder)" stroke-width="1.5" />

  <g transform="translate(40, 45)">
    <circle cx="30" cy="30" r="28" fill="#1E293B" stroke="#10B981" stroke-width="2" filter="url(#trustGlow)" />
    <!-- Cubes / Blockchain Icon -->
    <rect x="22" y="20" width="10" height="10" fill="none" stroke="#34D399" stroke-width="1.5" />
    <rect x="28" y="28" width="10" height="10" fill="none" stroke="#06B6D4" stroke-width="1.5" />
    <line x1="27" y1="25" x2="33" y2="29" stroke="#34D399" stroke-width="1" />
  </g>

  <g transform="translate(115, 55)">
    <text x="0" y="0" class="p-title">Trust Harvest</text>
    <text x="0" y="22" class="p-subtitle">BLOCKCHAIN MARKETPLACE • FARMER PLATFORM</text>
  </g>

  <g transform="translate(40, 130)">
    <text x="0" y="0" class="p-desc">🌱 Decentralized Agricultural Supply Chain &amp; Marketplace</text>
    <text x="0" y="24" class="p-desc">🔗 End-to-End Cryptographic Product Traceability &amp; Verification</text>
    <text x="0" y="48" class="p-desc">🤝 Direct Farmer-to-Consumer Fair Trade Smart Contracts</text>
  </g>

  <g transform="translate(40, 245)">
    <rect x="0" y="0" width="95" height="26" rx="6" fill="#1E293B" stroke="#10B981" stroke-opacity="0.5" />
    <text x="12" y="17" class="p-badge" fill="#34D399">Blockchain</text>

    <rect x="105" y="0" width="125" height="26" rx="6" fill="#1E293B" stroke="#06B6D4" stroke-opacity="0.5" />
    <text x="115" y="17" class="p-badge" fill="#22D3EE">Smart Contracts</text>

    <rect x="240" y="0" width="100" height="26" rx="6" fill="#1E293B" stroke="#2563EB" stroke-opacity="0.5" />
    <text x="250" y="17" class="p-badge" fill="#60A5FA">Traceability</text>

    <rect x="350" y="0" width="115" height="26" rx="6" fill="#1E293B" stroke="#334155" />
    <text x="360" y="17" class="p-badge">Farmer Platform</text>
  </g>
</svg>
