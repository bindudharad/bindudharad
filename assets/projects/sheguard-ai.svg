<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <radialGradient id="sheBg" cx="30%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050816" />
    </radialGradient>
    <linearGradient id="sheBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="sheGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono&amp;display=swap');
      .p-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; fill: #FFFFFF; }
      .p-subtitle { font-family: 'Inter', sans-serif; font-size: 13px; fill: #F472B6; letter-spacing: 1px; }
      .p-desc { font-family: 'Inter', sans-serif; font-size: 13px; fill: #94A3B8; }
      .p-badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #E2E8F0; }
    </style>
  </defs>

  <rect width="600" height="320" rx="14" fill="url(#sheBg)" />
  <rect x="1.5" y="1.5" width="597" height="317" rx="12.5" fill="none" stroke="url(#sheBorder)" stroke-width="1.5" />

  <g transform="translate(40, 45)">
    <circle cx="30" cy="30" r="28" fill="#1E293B" stroke="#EC4899" stroke-width="2" filter="url(#sheGlow)" />
    <!-- Shield Icon -->
    <path d="M 30 18 L 42 23 L 42 34 C 42 41, 30 46, 30 46 C 30 46, 18 41, 18 34 L 18 23 Z" fill="none" stroke="#F472B6" stroke-width="2" />
  </g>

  <g transform="translate(115, 55)">
    <text x="0" y="0" class="p-title">SheGuard AI</text>
    <text x="0" y="22" class="p-subtitle">WOMEN SAFETY • COMPUTER VISION &amp; SOS</text>
  </g>

  <g transform="translate(40, 130)">
    <text x="0" y="0" class="p-desc">🛡️ Real-Time Computer Vision &amp; Anomaly Detection</text>
    <text x="0" y="24" class="p-desc">🚨 Automated Instant Emergency SOS Alerts &amp; Trigger Systems</text>
    <text x="0" y="48" class="p-desc">📍 Live GPS Tracking &amp; Guardian Notification Pipeline</text>
  </g>

  <g transform="translate(40, 245)">
    <rect x="0" y="0" width="80" height="26" rx="6" fill="#1E293B" stroke="#06B6D4" stroke-opacity="0.5" />
    <text x="12" y="17" class="p-badge" fill="#22D3EE">OpenCV</text>

    <rect x="90" y="0" width="130" height="26" rx="6" fill="#1E293B" stroke="#7C3AED" stroke-opacity="0.5" />
    <text x="100" y="17" class="p-badge" fill="#C084FC">Machine Learning</text>

    <rect x="230" y="0" width="120" height="26" rx="6" fill="#1E293B" stroke="#EC4899" stroke-opacity="0.5" />
    <text x="240" y="17" class="p-badge" fill="#F472B6">Computer Vision</text>

    <rect x="360" y="0" width="110" height="26" rx="6" fill="#1E293B" stroke="#334155" />
    <text x="370" y="17" class="p-badge">Live Location</text>
  </g>
</svg>
