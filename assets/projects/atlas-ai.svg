<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <radialGradient id="atlasBg" cx="30%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050816" />
    </radialGradient>
    <linearGradient id="atlasBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="atlasGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono&amp;display=swap');
      .p-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; fill: #FFFFFF; }
      .p-subtitle { font-family: 'Inter', sans-serif; font-size: 14px; fill: #38BDF8; letter-spacing: 1px; }
      .p-desc { font-family: 'Inter', sans-serif; font-size: 13px; fill: #94A3B8; }
      .p-badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #E2E8F0; }
    </style>
  </defs>

  <!-- Base Card -->
  <rect width="600" height="320" rx="14" fill="url(#atlasBg)" />
  <rect x="1.5" y="1.5" width="597" height="317" rx="12.5" fill="none" stroke="url(#atlasBorder)" stroke-width="1.5" />

  <!-- Visual Icon / Graphic Element -->
  <g transform="translate(40, 45)">
    <!-- Outer Cyber Ring -->
    <circle cx="30" cy="30" r="28" fill="#1E293B" stroke="#2563EB" stroke-width="2" filter="url(#atlasGlow)" />
    <!-- Bot / Brain Graphic -->
    <path d="M 20 22 C 20 18, 40 18, 40 22 L 40 34 C 40 38, 20 38, 20 34 Z" fill="none" stroke="#06B6D4" stroke-width="2" />
    <circle cx="25" cy="27" r="2.5" fill="#38BDF8" />
    <circle cx="35" cy="27" r="2.5" fill="#38BDF8" />
    <line x1="26" y1="33" x2="34" y2="33" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(115, 55)">
    <text x="0" y="0" class="p-title">ATLAS AI</text>
    <text x="0" y="22" class="p-subtitle">FLAGSHIP • AI DESKTOP AUTOMATION PLATFORM</text>
  </g>

  <!-- Feature List -->
  <g transform="translate(40, 130)">
    <text x="0" y="0" class="p-desc">⚡ Human-like Desktop &amp; Browser Workflow Automation</text>
    <text x="0" y="24" class="p-desc">👁️ Integrated Vision, OCR &amp; Real-time Screen Analysis</text>
    <text x="0" y="48" class="p-desc">🧠 Autonomous Agentic Decision Engine &amp; Execution</text>
  </g>

  <!-- Tech Badges -->
  <g transform="translate(40, 245)">
    <!-- Python -->
    <rect x="0" y="0" width="75" height="26" rx="6" fill="#1E293B" stroke="#334155" />
    <text x="12" y="17" class="p-badge">Python</text>

    <!-- FastAPI -->
    <rect x="85" y="0" width="75" height="26" rx="6" fill="#1E293B" stroke="#06B6D4" stroke-opacity="0.5" />
    <text x="96" y="17" class="p-badge" fill="#06B6D4">FastAPI</text>

    <!-- OpenCV -->
    <rect x="170" y="0" width="75" height="26" rx="6" fill="#1E293B" stroke="#2563EB" stroke-opacity="0.5" />
    <text x="180" y="17" class="p-badge" fill="#60A5FA">OpenCV</text>

    <!-- SQLite -->
    <rect x="255" y="0" width="70" height="26" rx="6" fill="#1E293B" stroke="#334155" />
    <text x="267" y="17" class="p-badge">SQLite</text>

    <!-- AI Agents -->
    <rect x="335" y="0" width="85" height="26" rx="6" fill="#1E293B" stroke="#7C3AED" stroke-opacity="0.6" />
    <text x="345" y="17" class="p-badge" fill="#C084FC">AI Agents</text>
  </g>
</svg>
